<!DOCTYPE html>
<html>
<head>
    <title>SpaceXBot Hub - Deployment</title>

    <style>
        body{
            margin:0;

        .container{
            width:90%;
            max-width:900px;
            margin:40px auto;
            background:#1e293b;
            padding:25px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,.4);

        h1{
            text-align:center;
            color:#38bdf8;
        }

        input,select{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:8px;
            background:#334155;
            color:white;
        }

        button{
            width:100%;
            padding:14px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:25px;
        }

        th{
            background:#2563eb;
            padding:12px;
        }

        td{
            padding:12px;
            text-align:center;
            background:#334155;
        }

        tr:nth-child(even){
            background:#475569;
        }
    </style>
</head>
