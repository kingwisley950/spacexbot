<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpaceXBot Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:linear-gradient(135deg,#020617,#0f172a,#111827);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}

.login-box{

width:380px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(20px);

padding:40px;

border-radius:20px;

box-shadow:0 0 40px rgba(0,0,0,.5);

color:white;

}

.logo{

text-align:center;

font-size:32px;

font-weight:bold;

margin-bottom:10px;

}

.subtitle{

text-align:center;

margin-bottom:30px;

color:#bbb;

}

input{

width:100%;

padding:14px;

margin-top:15px;

border:none;

border-radius:10px;

background:#1e293b;

color:white;

font-size:15px;

}

input:focus{

outline:none;

border:2px solid #3b82f6;

}

button{

width:100%;

padding:15px;

margin-top:25px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#1d4ed8;

}

.links{

display:flex;

justify-content:space-between;

margin-top:20px;

font-size:14px;

}

.links a{

color:#60a5fa;

text-decoration:none;

}

.links a:hover{

text-decoration:underline;

}

.footer{

margin-top:30px;

text-align:center;

color:#888;

font-size:13px;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">🚀 SpaceXBot</div>

<div class="subtitle">
Welcome Back
</div>

<form method="POST">

<input
type="email"
name="email"
placeholder="Email Address"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
LOGIN
</button>

</form>

<div class="links">

<a href="#">Forgot Password?</a>

<a href="/register">Create Account</a>

</div>

<div class="footer">

SpaceXBot Technologies ©2026

</div>

</div>

</body>
</html>
